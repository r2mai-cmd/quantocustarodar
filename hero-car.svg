<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Carro moderno em movimento</title>
<desc id="desc">Ilustração genérica e realista de um carro moderno, sem marca ou modelo específico.</desc>
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbfc"/><stop offset=".42" stop-color="#d9e4e8"/><stop offset="1" stop-color="#8fa3ad"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173448"/><stop offset="1" stop-color="#071721"/></linearGradient>
  <linearGradient id="trim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#102b46"/><stop offset="1" stop-color="#274b60"/></linearGradient>
  <radialGradient id="wheel"><stop offset="0" stop-color="#8e9aa0"/><stop offset=".35" stop-color="#303b42"/><stop offset=".72" stop-color="#111a1f"/><stop offset="1" stop-color="#05090b"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="13"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".22"/></filter>
</defs>
<!-- road shadow -->
<ellipse cx="600" cy="424" rx="315" ry="38" fill="#102b46" opacity=".16" filter="url(#shadow)"/>
<!-- car silhouette -->
<path d="M246 359c18-50 55-75 108-90l82-88c20-22 48-35 78-35h134c37 0 71 15 96 42l58 63c43 11 78 31 101 62 11 15 16 33 16 51v19H246Z" fill="url(#body)" stroke="#183446" stroke-width="7" filter="url(#soft)"/>
<!-- windows -->
<path d="M451 198h157c29 0 56 11 77 31l42 42H405l37-50c3-5 5-10 9-14Z" fill="url(#glass)" stroke="#183446" stroke-width="5"/>
<path d="M594 200v71" stroke="#6d8792" stroke-width="4" opacity=".8"/>
<path d="M450 271h276" stroke="#8da0a8" stroke-width="4" opacity=".55"/>
<!-- roof highlight -->
<path d="M425 185c27-28 51-39 89-39h122c36 0 65 11 91 34" fill="none" stroke="#ffffff" stroke-width="8" opacity=".8" stroke-linecap="round"/>
<!-- body character lines -->
<path d="M281 327c91 14 198 18 329 18 126 0 231-8 313-25" fill="none" stroke="#70858f" stroke-width="5" opacity=".65"/>
<path d="M301 290c79 8 174 12 287 12 129 0 240-7 320-19" fill="none" stroke="#ffffff" stroke-width="5" opacity=".7"/>
<!-- front light -->
<path d="M793 291c42 3 70 14 91 29l-24 19h-76l-14-21z" fill="#eefcff" stroke="#1a4558" stroke-width="4"/>
<path d="M802 300h58" stroke="#b7ffdf" stroke-width="5" stroke-linecap="round"/>
<!-- grille -->
<path d="M824 344h92l-19 34h-67z" fill="#122a38"/>
<path d="M834 349h73M829 358h73M824 367h73" stroke="#5b747f" stroke-width="3" opacity=".65"/>
<!-- side mirrors -->
<path d="M440 267c-17-7-33-5-45 5l-8 10h49z" fill="#102b46"/>
<path d="M781 267c17-7 34-5 46 5l8 10h-50z" fill="#102b46"/>
<!-- wheels -->
<circle cx="405" cy="378" r="63" fill="#0b1216"/>
<circle cx="405" cy="378" r="45" fill="url(#wheel)"/>
<circle cx="405" cy="378" r="15" fill="#b8c3c7"/>
<circle cx="790" cy="378" r="63" fill="#0b1216"/>
<circle cx="790" cy="378" r="45" fill="url(#wheel)"/>
<circle cx="790" cy="378" r="15" fill="#b8c3c7"/>
<!-- green energy accent -->
<path d="M519 337h92" stroke="#13a653" stroke-width="7" stroke-linecap="round"/>
<path d="M548 327 535 346h14l-6 16 22-24h-14z" fill="#13a653"/>
<!-- ground line -->
<path d="M180 441h690" stroke="#102b46" stroke-width="4" stroke-linecap="round" opacity=".18"/>
</svg>
